<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Details - Console</title>
</head>
<body>
  <h1>Open Inspect → Console to view the output</h1>

  <script>
    // We put the JSON data directly into a variable so we don't need fetch() for Q2
    const data = {
      "books": [
        {
          "title": "The Great Gatsby",
          "author": "F. Scott Fitzgerald",
          "publicationYear": 1925,
          "genres": ["Fiction", "Classics"]
        },
        {
          "title": "To Kill a Mockingbird",
          "author": "Harper Lee",
          "publicationYear": 1960,
          "genres": ["Fiction", "Coming-of-Age"]
        }
      ]
    };

    const books = data.books;

    // (a) Title of the first book
    console.log('(a) Title of the first book: ' + books[0].title);

    // (b) Author of the second book
    console.log('(b) Author of the second book: ' + books[1].author);

    // (c) Genres of all books
    console.log('(c) Genres of all books:');
    books.forEach(function (book) {
      console.log(book.title + ': ' + book.genres.join(', '));
    });
  </script>
</body>
</html>
